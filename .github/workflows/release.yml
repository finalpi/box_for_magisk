name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example: v1.11.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release tag: ${VERSION}" >&2
            exit 1
          }
          MODULE_VERSION="$(sed -n 's/^version=//p' module.prop)"
          [[ "${MODULE_VERSION}" == "${VERSION}" ]] || {
            echo "module.prop version (${MODULE_VERSION}) does not match release tag (${VERSION})" >&2
            exit 1
          }
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build flashable module
        shell: bash
        run: |
          chmod +x build.sh
          ./build.sh
          ASSET="box_for_root-${{ steps.version.outputs.version }}.zip"
          test -f "${ASSET}"
          unzip -t "${ASSET}"
          sha256sum "${ASSET}" > "${ASSET}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: box_for_root-${{ steps.version.outputs.version }}
          path: |
            box_for_root-${{ steps.version.outputs.version }}.zip
            box_for_root-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Box for Root ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: |
            box_for_root-${{ steps.version.outputs.version }}.zip
            box_for_root-${{ steps.version.outputs.version }}.zip.sha256
